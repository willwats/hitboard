:root{

    --hit:#3DDC97; --hit-bg:#14392B; --miss:#FF7D69; --miss-bg:#3B1F1A; --amber:#F2B93B; --amber-bg:#3A2E10; --btn:#E6EEE9; --btn-ink:#0D1512;

  --hit:#3DDC97; --hit-bg:#14392B; --miss:#FF7D69; --miss-bg:#3B1F1A; --amber:#F2B93B; --amber-bg:#3A2E10; --btn:#E6EEE9; --btn-ink:#0D1512;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;

button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--hit)}
:focus-visible{outline:2px solid var(--hit);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.logo span{color:var(--hit)}
.stamp{font-family:var(--font-data);font-size:11px;color:var(--muted);text-align:right;line-height:1.3}
h2{font-family:var(--font-display);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:18px 0 4px;line-height:1.05;text-wrap:balance}
h3{font-family:var(--font-display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:18px 0 6px}
.lede{color:var(--muted);margin:0 0 14px;max-width:60ch}
.label{font-family:var(--font-data);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.feed{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
.gtop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.teams{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px;font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;text-transform:uppercase}
.teams i{font-style:normal;font-size:16px;color:var(--muted);font-family:var(--font-data);font-weight:400}
.pbar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--surface2);gap:2px}
.pbar i{display:block;background:var(--surface2);border:1px solid var(--line);height:100%}
.pbar i.lead{background:var(--hit);border-color:var(--hit)}
.plabels{display:flex;justify-content:space-between;font-family:var(--font-data);font-size:13px;margin-bottom:4px}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 0 0;font-family:var(--font-data);font-size:12.5px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-family:var(--font-data);font-size:11px;padding:2px 8px;border-radius:3px;background:var(--surface2);color:var(--muted)}
.tag.warn{background:var(--amber-bg);color:var(--amber)} .tag.good{background:var(--hit-bg);color:var(--hit)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:9px 14px;font-weight:500;min-height:40px}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);flex:1}
.btn.done{background:var(--hit-bg);color:var(--hit);border-color:var(--hit-bg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;white-space:nowrap;font-size:14px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 12px;min-height:58px}
.prow:first-child{border-top:0}
.prow:active{background:var(--surface2)}
.pr-name{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-sub{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-r{text-align:right;font-family:var(--font-data)}
.pr-r b{display:block;font-weight:500;font-size:17px}
.pr-r span{font-size:11px;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
nav .in{display:flex;width:100%;max-width:640px}
nav button{flex:1;background:none;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:500;min-height:48px;position:relative}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:25%;right:25%;height:3px;background:var(--hit);border-radius:0 0 3px 3px}
.badge{position:absolute;top:2px;left:calc(50% + 8px);background:var(--hit);color:var(--btn-ink);font-family:var(--font-data);font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.foot{margin:22px 0 0;font-size:12px;color:var(--muted);max-width:60ch}
.scrim{position:fixed;inset:0;background:rgba(5,12,9,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:12px 12px 0 0;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}

.sh-head h2{margin:2px 0 0;font-size:28px}
.x{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:36px;height:36px;flex:none;font-size:18px;line-height:1}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}

th:first-child,td:first-child{text-align:left;white-space:normal}

td{font-family:var(--font-data)}
td:first-child{font-family:var(--font-body)}
ul.pts{margin:0;padding-left:18px;display:grid;gap:6px}
.src{font-size:12.5px;color:var(--muted)}
.field{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-bottom:8px}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:8px 10px;text-align:right;font-family:var(--font-data);width:100%;min-height:40px}
.slider{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.slider input{flex:1;accent-color:var(--hit);min-width:0}
.slider b{font-family:var(--font-data);font-weight:500;min-width:44px;text-align:right}
.out{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.tile .v{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.05}
.tile .v.hi{color:var(--hit)} .tile .v.lo{color:var(--miss)}
.tile .k{font-family:var(--font-data);font-size:11px;color:var(--muted)}
.verdict{background:var(--surface2);border-radius:5px;padding:10px 12px;font-size:14px}
.picked{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px;border-top:1px solid var(--line)}
.picked:first-child{border-top:0}
.rm{border:0;background:none;color:var(--muted);font-size:20px;width:36px;height:36px}
.slip{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin-top:12px;display:grid;gap:10px}
.slip .r{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.slip .r b{font-family:var(--font-data);font-weight:500}
.slip input{width:90px;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:6px 8px;text-align:right;font-family:var(--font-data)}
.note{background:var(--amber-bg);border-radius:5px;padding:9px 12px;font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.names{color:var(--muted);font-size:13px;margin:-4px 0 10px}
.scoreline{display:flex;gap:18px;font-family:var(--font-data);font-size:15px;color:var(--muted);margin:0 0 10px}
.scoreline b{font-size:22px;font-weight:500;color:var(--muted)} .scoreline .w,.scoreline .w b{color:var(--ink)}
.pill{font-family:var(--font-data);font-size:11px;padding:2px 8px;border-radius:3px;background:var(--surface2);color:var(--muted)}
.pill.live{background:var(--miss-bg);color:var(--miss)} .pill.final{background:var(--surface2);color:var(--ink)}
.cap{font-family:var(--font-data);font-size:11px;color:var(--muted);margin-top:4px}
.rbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.rbar .btn{min-width:150px}
.msg{font-size:13px;margin-top:4px;max-width:34ch}
.msg.warn{color:var(--amber)} .msg.good{color:var(--hit)}
.btn:disabled{opacity:.6;cursor:default}
.hrpill{font-family:var(--font-data);font-weight:500;font-size:14px;padding:2px 8px;border-radius:4px;display:inline-block}
.hrpill.hi{background:var(--hit-bg);color:var(--hit)} .hrpill.lo{background:var(--miss-bg);color:var(--miss)} .hrpill.mid{background:var(--surface2)}

.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.bcard{padding:12px 14px}
.bcard .facts{margin-top:6px}
.seg2{margin:0 0 12px}
details.bcard{margin-bottom:8px}
details.bcard summary{cursor:pointer;min-height:32px;display:flex;align-items:center;gap:8px}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

  '<h3>Refreshing</h3><ul class="pts"><li>Scores refresh when you open the page and when you tap <b>Refresh scores</b>. The installed phone app also refreshes every 30 seconds while open, using ESPN’s public scoreboard.</li><li>If your view cannot reach the feed, the button says so. Ask Claude to “refresh Hitboard” and it will re-research lines, injuries and stats and update the page.</li><li>Lines, injuries and player stats do not come from the feed, so they only change when Claude updates the page.</li></ul>'+
  '<h3>What is real</h3><ul class="pts"><li>Schedules, scores and win probabilities from the data feed.</li><li>NFL spreads, totals and moneylines, each labeled with source and date. Older listings are marked, and where two sources differ both are shown.</li><li>Kalshi and Polymarket US prices (normalized so each pair sums to 100%).</li><li>An NBA and college football breakdown on each upcoming game in the Games tab: prediction, strengths and weaknesses, player hit rates, straight bets and uncertainty, from last season’s NBA scoring and this season’s college scoring. Tap Details on an upcoming game.</li><li>A matchup deep dive for every NFL game this week: records, scoring, pass and run offense and defense, pressure and takeaways with league ranks from Pro Football Reference. Three games (NE-CHI, DEN-ARI, GB-DET) have hand-written angles. The others have angles generated from the stat ranks.</li></ul>'+
  '<h3>Model checks</h3><ul class="pts">'+liveLi()+'<li><b>Starting weights.</b> The first weights came from a one-time check on 4,129 old NFL games (1996 to 2017, the slieb74/NFL-Betting-Data set). They are only a starting point. The 2026 record above now adjusts them as games finish.</li><li><b>Market beats the model.</b> The closing total was off by 10.69 points on average, a stats-only model by 10.96. Its over/under picks hit 50%. So totals now lean 90% on the market line, and chances are held near 50%.</li><li><b>Margin.</b> Blending 30% stats model with 70% market line cut the average spread error slightly (10.52 versus 10.56), so that is the weight used.</li><li><b>Wind is the one rule that held.</b> Outdoor games with sustained wind of 15 to 19 mph went under 54% of the time and 20 mph or more 60%, so totals are trimmed 0.9 and 2.3 points. Cold and rain showed no edge, so they are ignored.</li><li><b>Machine learning.</b> Ridge regression and gradient boosting on team stats, line, weather and week did not beat the line when tested the honest way (train on past seasons, test on the next), hitting 48 to 49%. They are not used.</li><li><b>Shrinkage.</b> Early-season points per game are pulled toward the league average, and player averages toward their position’s average, because five games is a small sample.</li></ul><h3>What is modeled</h3><ul class="pts"><li><b>Prop probability.</b> Normal curve centered on the player’s per-game average, with spread set by stat type (passing 22%, rushing 55%, receiving yards 60%, receptions 40% of the mean, widened 30% for samples under 3 games). The matchup slider shifts the average.</li><li><b>Edge.</b> Model probability minus the price’s implied probability with the sportsbook margin removed.</li></ul>'+

function ordn(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}

function lgPpg(){var v=Object.keys(TS).map(function(k){return mv(k,'ppg')});return v.reduce(function(a,b){return a+b},0)/v.length}
function sv(k,m){var v=mv(k,m);if(m!=='ppg'&&m!=='papg')return v;return (v*TS[k].G+3*lgPpg())/(TS[k].G+3)}
function calibCover(p){return Math.min(.55,.5+.25*(p-.5))}
function calibTotal(p,under,w){var q=Math.min(.53,.5+.2*(p-.5));if(under&&w&&w.pu)q=Math.max(q,w.pu);return q}
function kelly(p){var b=100/110,f=(p*b-(1-p))/b;return f<=0?'no edge':(f/4*100).toFixed(1)+'% of bankroll'}
var PHI_SD={m:13.5,t:10.5};
function model(g){
  var a=g.a,h=g.h;
  if(!TS[a]||!TS[h])return null;
  var sa=(sv(a,'ppg')+sv(h,'papg'))/2-1.25,sh=(sv(h,'ppg')+sv(a,'papg'))/2+1.25;
  var mk_h=g.fav==='h'?g.fs:g.ds,mk_a=g.fav==='h'?g.ds:g.fs;
  var fgw=feedFor(g),wa=wxAdj(h,fgw&&fgw.start),wadj=wa.adj;
  // backtest: stats model adds value on the margin (about 30% weight) but not on the total (about 10%)
  var margin=0.3*(sh-sa)+0.7*(mk_h-mk_a),total=0.1*(sa+sh)+0.9*(mk_a+mk_h)+wadj;
  var rawM=margin,rawT=total,LN=learn('nfl');margin+=LN.dm;total+=LN.dt;
  return {sa:sa,sh:sh,ma:mk_a,mh:mk_h,ba:(total-margin)/2,bh:(total+margin)/2,margin:margin,total:total,rmargin:rawM,rtotal:rawT,LN:LN,wadj:wadj,wa:wa,mmargin:mk_h-mk_a,mtotal:mk_a+mk_h,smargin:sh-sa,stotal:sa+sh};
}
function confOf(d){d=Math.abs(d);return d>=3?'high':d>=1.5?'medium':'low'}
function straightBets(g,m){
  var out=[];
  // spread: the side the blend likes versus the market line
  var homeSpread=-m.mmargin; // home line (negative when home favored)
  var edge=m.margin-m.mmargin; // >0 favors home covering
  var side=edge>=0?g.h:g.a;
  var line=edge>=0?(m.mmargin>=0?'-'+Math.abs(m.mmargin).toFixed(1):'+'+Math.abs(m.mmargin).toFixed(1)):(m.mmargin>=0?'+'+Math.abs(m.mmargin).toFixed(1):'-'+Math.abs(m.mmargin).toFixed(1));
  var z=(Math.abs(m.margin-m.mmargin))/PHI_SD.m;
  var p=calibCover(Phi(z));
  out.push({t:'sp',side:edge>=0?'h':'a',num:parseFloat(line),mk:'Spread',pick:side+' '+line,p:p,conf:confOf(edge),why:'Blended margin is '+g.h+' by '+m.margin.toFixed(1)+' versus the market '+g.h+' by '+m.mmargin.toFixed(1)+'.'});
  var te=m.total-m.mtotal,ov=te>=0;
  out.push({t:'tot',over:ov,num:g.total,mk:'Total',pick:(ov?'Over ':'Under ')+g.total,p:calibTotal(Phi(Math.abs(te)/PHI_SD.t),!ov,m.wa),conf:m.wa&&m.wa.pu&&!ov?'medium':'low',why:'Blended total is '+m.total.toFixed(1)+' versus the listed '+g.total+'. The stats-only model says '+m.stotal.toFixed(1)+'.'+(m.wadj<0?' Wind adjustment '+m.wadj.toFixed(1)+' points.':'')+' Past totals were hard to beat, so the chance is held near 50%.'});
  var wp=Phi(m.margin/PHI_SD.m);
  var ws=wp>=0.5?g.h:g.a,wpp=wp>=0.5?wp:1-wp;
  var mkp=g.bkA!=null?(wp>=0.5?1-g.bkA:g.bkA):(wp>=0.5?1-g.mkA:g.mkA);
  out.push({t:'ml',side:wp>=0.5?'h':'a',mk:'Moneyline',pick:ws+' to win',p:wpp,conf:wpp>=0.7?'high':wpp>=0.6?'medium':'low',why:'Blended win chance '+pc(wpp)+'%. '+(g.bkA!=null?'Sportsbook price (margin removed)':'Prediction-market price')+' implies '+pc(wp>=0.5?(g.bkA!=null?1-g.bkA:1-g.mkA):(g.bkA!=null?g.bkA:g.mkA))+'% for '+g.h+'.'});
  out.forEach(function(b){b.p0=b.p;b.p=learnP(m.LN,b.t,b.p);b.rm=m.rmargin;b.rt=m.rtotal});
  return out;
}

function tdTeam(t){return t==='JAC'?'JAX':t}
function smooth(h,g){return (h+1)/(g+2)}
function legList(lg){
  var L=[];
  if(lg==='nfl'){
    DATA.hit.nfl.ladders.forEach(function(lad){
      lrows(lad).forEach(function(r){
        var nx=nflNext(r[1]);if(!nx)return;
        for(var i=lad.thr.length-1;i>=0;i--){
          var p=smooth(r[3][i],r[2]);
          L.push({name:r[0],team:r[1],mk:lad.stat+' '+lad.thr[i]+'+',p:p,src:r[3][i]+' of '+r[2]+' games',nx:nx,kind:'yds',pos:lad.pos});
        }
      });
    });
    tdParse().forEach(function(r){
      var nx=nflNext(tdTeam(r.t));if(!nx)return;
      L.push({name:r.n,team:r.t,mk:'Anytime TD',p:smooth(r.h,10),src:r.h+' of last 10 games',nx:nx,kind:'td'});
    });
  }else if(lg==='nba'){
    DATA.hit.nba.tables.forEach(function(t){t.rows.forEach(function(r){
      var nx=NBA_G[r[1]];if(!nx)return;
      L.push({name:r[0],team:r[1],mk:t.stat+' over '+t.line,p:smooth(r[2],r[3]),src:r[2]+' of '+r[3]+' games last season',nx:{txt:nx},kind:'nba'});

function fairOdds(p){if(p<=0||p>=1)return '—';return p>=.5?'-'+Math.round(100*p/(1-p)):'+'+Math.round(100*(1-p)/p)}
function pickLegs(all,minP,n,preferStack,kinds){
  var pool=all.filter(function(l){return l.p>=minP&&(!kinds||kinds.indexOf(l.kind)>=0)});
  // best leg per player and market family
  var best={};pool.forEach(function(l){var k=l.name+'|'+(l.kind==='td'?'td':l.mk.split(' ')[0]);
    if(!best[k]||l.p<best[k].p)best[k]=l}); // highest threshold that still clears the bar
  pool=Object.keys(best).map(function(k){return best[k]});
  pool.sort(function(a,b){return b.p-a.p});
  var chosen=[],names={};
  function add(l){if(!l||names[l.name])return false;names[l.name]=1;chosen.push(l);return true}
  if(preferStack){
    // a quarterback plus one of his receivers in the same game is the classic positively correlated pair
    var qbs=pool.filter(function(l){return l.pos&&/Quarter/.test(l.pos)});
    for(var i=0;i<qbs.length&&chosen.length<2;i++){
      var rc=pool.filter(function(l){return l.team===qbs[i].team&&l.pos&&/receiving|Tight|Wide/i.test(l.pos)&&l.name!==qbs[i].name})[0];
      if(rc){add(qbs[i]);add(rc)}
    }
  }
  for(var j=0;j<pool.length&&chosen.length<n;j++)add(pool[j]);
  return chosen;
}
function corrNote(legs){
  var byTeam={};legs.forEach(function(l){(byTeam[l.team]=byTeam[l.team]||[]).push(l)});
  var notes=[];
  Object.keys(byTeam).forEach(function(t){var a=byTeam[t];
    if(a.length>=2)notes.push(t+': '+a.map(function(x){return x.name}).join(' and ')+' are on the same team, so a high-volume passing game helps both legs. That positive link makes the real chance of both higher than the multiplied figure.');
  });
  var byG={};legs.forEach(function(l){var k=l.nx.id||l.nx.txt;(byG[k]=byG[k]||new Set()).add(l.team)});
  Object.keys(byG).forEach(function(k){if(byG[k].size>=2)notes.push('Legs from both teams in the same game depend on a shootout, which also lifts both sides.')});
  return notes.length?notes:['No two legs share a game or team, so the multiplied chance is a fair read but there is no correlation boost.'];
}
function parlayCard(title,desc,legs){

  return '<div class="card bcard"><div class="label">'+title+'</div><p class="src" style="margin:4px 0 8px">'+desc+'</p>'+
   '<div class="tblwrap"><table><thead><tr><th>Leg</th><th>Chance</th></tr></thead><tbody>'+legs.map(function(l){return '<tr><td>'+esc(l.name)+' · '+esc(l.mk)+'<br><span class="src">'+esc(l.nx.txt)+' · '+esc(l.src)+'</span></td><td><span class="hrpill '+(l.p>=.8?'hi':l.p<.5?'lo':'mid')+'">'+pc(l.p)+'%</span></td></tr>'}).join('')+'</tbody></table></div>'+
   '<div class="facts"><span>All legs hit <b>'+(prob*100).toFixed(1)+'%</b></span><span>Fair odds <b>'+fairOdds(prob)+'</b></span></div>'+
   '<ul class="pts" style="margin-top:8px">'+corrNote(legs).map(function(n){return '<li>'+esc(n)+'</li>'}).join('')+'</ul>'+
   '<p class="src">Bet it only if your book pays better than the fair odds above.</p></div>';
}
function vParlay(){
  var lg=S.sport,name=LG.filter(function(l){return l[0]===lg})[0][1];

  var all=legList(lg);

  var lsh=nfl?pickLegs(all,.4,5,false,['td']):pickLegs(all,.3,5,false,null).slice(0,5);
  h+='<p class="lede">Built only from the hit-rate data in this app, using legs whose game has not started. Each leg’s chance is its hit count nudged toward 50% (one extra hit and one extra miss) because the samples are small. '+(lg==='nfl'?'Yardage legs use the Covers hit-rate ladders and touchdown legs use the JediBets last-10 rates.':lg==='nba'?'Legs use last season’s last-10 hit rates because the 2026-27 season starts Oct 20.':'Legs use the last five games and few teams in the table have a game left this week.')+' Sportsbook odds were not readable, so each parlay shows fair odds to compare with your book.</p>';
  h+=parlayCard('Conservative','Highest-probability yardage or stat legs.',cons);
  h+=parlayCard('Standard','Strong legs, with a quarterback-plus-receiver stack when one clears the bar.',std);
  h+=parlayCard('Aggressive','Lower bar'+(nfl?', mixing yardage and touchdown legs.':'.'),agg);
  h+=parlayCard('Long shot',nfl?'Anytime touchdown scorers with the best last-10 rates.':'Lowest bar in the data.',lsh);
  return h+'<p class="note" style="margin-top:12px">Parlays need every leg to win. Chances here assume the legs are independent apart from the correlation notes. If injuries change a player’s role, drop the leg.</p>'+foot();
}

function learn(lg){
  var gm={};S.log.forEach(function(x){if(x.lg===lg&&x.res&&x.rm!=null&&x.rt!=null&&x.am!=null)gm[x.gid]=x});
  var ks=Object.keys(gm),n=ks.length,em=0,et=0;
  ks.forEach(function(k){var x=gm[k];em+=x.am-x.rm;et+=x.atot-x.rt});
  var w=n/(n+40),cl=function(v){return Math.max(-3,Math.min(3,v))};
  var L={n:n,dm:n?cl(w*em/n):0,dt:n?cl(w*et/n):0,dp:{ml:0,sp:0,tot:0},cnt:{}};
  ['ml','sp','tot'].forEach(function(t){
    var e=S.log.filter(function(x){return x.lg===lg&&x.t===t&&x.res&&x.res!=='P'&&x.p0!=null}),m=e.length;L.cnt[t]=m;
    if(m<20)return;
    var hit=e.filter(function(x){return x.res==='W'}).length/m,ap=e.reduce(function(a,x){return a+x.p0},0)/m;

}

function loadStats(g){

  if(c&&c.st==='ok'&&(kind(g)==='final'||now-c.t<60000))return Promise.resolve();
  if(c&&c.st==='err'&&now-c.t<60000)return Promise.resolve();
  S.stats[g.id]={st:'load',t:now,d:c&&c.d};
  var fin=function(d,e){S.stats[g.id]=d?{st:'ok',t:Date.now(),d:d}:{st:'err',t:Date.now(),d:c&&c.d};onStats(g)};
  var cl=window.claude;

    return cl.use('mcp').then(function(mcp){
      if(!mcp){fin(null);return}
      return mcp.callTool(FEED_SERVER,FEED_TOOL,{data_type:'game_stats',league:g.lg,game_id:g.sid},{cache:false}).then(function(res){
        var pl=res&&res.payload;if(typeof pl==='string'){try{pl=JSON.parse(pl)}catch(e){}}
        if(!pl||typeof pl!=='object'){fin(null);return}
        fin(srNorm(g,pl));

    return fetch('https://site.api.espn.com/apis/site/v2/sports/'+ESPN[g.lg]+'/summary?event='+encodeURIComponent(g.sid),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){fin(espnStats(g,j))}).catch(function(){fin(null)});

function statOf(st,k){return st&&st.rows.filter(function(r){return r.k===k})[0]||null}
function recap(g,st){
  if(g.sa==null||g.sh==null)return '';
  var k=kind(g),hoops=g.lg==='nba'||g.lg==='ncaamb',out=[];
  var tie=g.sa===g.sh,w=g.sa>g.sh?g.a:g.h,l=w===g.a?g.h:g.a,ws=Math.max(g.sa,g.sh),ls=Math.min(g.sa,g.sh),mg=ws-ls,tot=ws+ls;
  var desc=hoops?(mg<=3?'decided by 3 or fewer':mg<=9?'a single-digit game':mg<=19?'a double-digit win':'a blowout'):(mg<=3?'decided by a field goal or less':mg<=8?'a one-score game':mg<=16?'a two-score game':'a blowout');
  if(k==='live')out.push((tie?g.a+' and '+g.h+' are tied '+g.sa+'-'+g.sh:w+' leads '+l+' '+ws+'-'+ls)+' in a game still in progress.');
  else out.push(tie?g.a+' and '+g.h+' tied '+g.sa+'-'+g.sh+'.':w+' beat '+l+' '+ws+'-'+ls+' ('+desc+').');

  if(per&&per.length>=2&&k==='final'){
    var n=g.lg==='ncaamb'?1:2,ha=0,hh=0;per.slice(0,n).forEach(function(p){ha+=+p.a||0;hh+=+p.h||0});
    if(ha===hh)out.push('The game was tied at halftime, '+ha+'-'+hh+'.');
    else{var hw=ha>hh?g.a:g.h;if(!tie&&hw!==w)out.push(w+' trailed '+Math.max(ha,hh)+'-'+Math.min(ha,hh)+' at halftime and came back.');else if(!tie)out.push(w+' led '+Math.max(ha,hh)+'-'+Math.min(ha,hh)+' at halftime and held on.')}

  if(y&&isFinite(y.na)&&isFinite(y.nh)&&y.na!==y.nh){var ya=y.na>y.nh;out.push((ya?g.a:g.h)+' out-gained '+(ya?g.h:g.a)+' '+Math.max(y.na,y.nh)+' to '+Math.min(y.na,y.nh)+' in total yards.')}

    out.push('The teams scored '+tot+' combined against a projected '+pr.total.toFixed(0)+(Math.abs(d)<3?', right on the number.':(d>0?', '+d.toFixed(0)+' points over.':', '+Math.abs(d).toFixed(0)+' points under.')));
  }

}

    if(i>=urls.length)return Promise.resolve({lg:lg,e:{code:'upstream_error',detail:last}});
    var u=urls[i++];
    return fetch(u).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){
      var ev=j.events||(j.content&&j.content.sbData&&j.content.sbData.events);
      if(!ev)throw new Error('no games in reply');
      return {lg:lg,games:espnNorm(lg,ev)};
    }).catch(function(e){last=(e&&e.message)||'network error';return next()});
  }
  return next();
}
function preloadWx(){var seen={},ps=[];(S.feed.nfl||[]).forEach(function(g){if(kind(g)!=='up')return;var k=nt(g.h);if(seen[k])return;seen[k]=1;ps.push(loadWx(k))});Promise.all(ps).then(function(){var ae=document.activeElement;if(ps.length&&!(ae&&ae.tagName==='INPUT')&&!S.sheet)render()})}
var ESPN_MSG='Could not reach ESPN. Check your connection and tap Refresh again.';
function doRefresh(silent){
  if(S.busy)return;
  silent=silent===true;
  if(!silent){S.busy=true;S.msg='';S.msgKind='';render()}
  else S.busy=true;
  var done=function(msg,k){
    S.busy=false;if(!silent||msg){S.msg=silent?'':msg;S.msgKind=k||''}
    var ae=document.activeElement;
    if(!(silent&&ae&&ae.tagName==='INPUT'))render();
  };
  var finish=function(out,srcName,failMsg){
    var ok=out.filter(function(o){return o.games}),bad=out.filter(function(o){return o.e});
    ok.forEach(function(o){S.feed[o.lg]=o.games});
    if(ok.length){setTimeout(loadAvail,0);setTimeout(trackPicks,50)}
    if(ok.length){S.feedAt=Date.now();S.live=true;S.src=srcName;preloadWx()}
    var fm=failMsg&&bad.length&&bad[0].e&&bad[0].e.detail?failMsg+' ('+bad[0].e.detail+')':failMsg;
    if(!ok.length){if(silent&&S.live){done('', '')}else{silent=false;done(fm||errMsg(bad[0].e),'warn')}}
    else if(bad.length)done('Updated '+ok.length+' of 4 sports. '+(fm||errMsg(bad[0].e)),'warn');
    else done(silent?'':'Updated all four sports.','good');
  };
  var cl=window.claude;
  if(cl&&cl.use){
    cl.use('mcp').then(function(mcp){
      if(!mcp){done(MSG_NOCONN,'warn');return}
      Promise.all(LG.map(function(l){
        return mcp.callTool(FEED_SERVER,FEED_TOOL,{data_type:'scores',league:l[0]},{cache:false}).then(function(res){
          var pl=res&&res.payload;if(typeof pl==='string'){try{pl=JSON.parse(pl)}catch(e){}}
          if(!pl||!Array.isArray(pl.games))return {lg:l[0],e:{code:'bad_shape'}};
          return {lg:l[0],games:normFeed(l[0],pl.games)};
        },function(e){return {lg:l[0],e:e}});
      })).then(function(out){finish(out,'the data feed')});
    },function(){done(MSG_NOCONN,'warn')});
  }else if(typeof fetch==='function'){
    Promise.all(LG.map(function(l){return fetchEspn(l[0])})).then(function(out){finish(out,'ESPN',ESPN_MSG)});
  }else done(MSG_NOCONN,'warn');
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.dataset.act;
  if(act==='scrim'){if(e.target!==el)return;S.sheet=null;renderSheet();return}
  if(act==='tab'){S.tab=el.dataset.t;render();window.scrollTo(0,0)}
  else if(act==='sport'){S.sport=el.dataset.v;S.cat=null;render()}
  else if(act==='refresh'){doRefresh()}
  else if(act==='cat'){S.cat=el.dataset.v;render()}
  else if(act==='gf'){S.gf=el.dataset.v;render()}
  else if(act==='dk'){S.dk=el.dataset.v;S.dmore=false;render()}
  else if(act==='dgm'){S.dgm=el.dataset.v;S.dmore=false;render()}
  else if(act==='dmore'){S.dmore=true;render()}
  else if(act==='gprops'){S.gf=el.dataset.id;S.tab='props';S.sport='nfl';S.cat='calc';render();window.scrollTo(0,0)}
  else if(act==='game'){S.sheet={type:'game',id:el.dataset.id};var gw=gameById(el.dataset.id),fw=gw&&feedFor(gw);if(gw)loadWx(gw.h).then(function(){if(S.sheet&&S.sheet.id===gw.id)renderSheet()});renderSheet()}
  else if(act==='fgame'){S.sheet={type:'fgame',id:el.dataset.id};var fg0=find(el.dataset.id);if(fg0)loadStats(fg0);if(fg0&&fg0.lg==='nfl')loadWx(nt(fg0.h)).then(function(){if(S.sheet&&S.sheet.id===fg0.id)renderSheet()});renderSheet()}
  else if(act==='prop'){openProp(el.dataset.id)}
  else if(act==='close'){S.sheet=null;renderSheet()}
  else if(act==='save'){
    var s=S.sheet,side=el.dataset.side;if(!s||!(Math.abs(s.oo)>=100)||!(Math.abs(s.uo)>=100))return;
    var p=propById(s.id),c=calc(p,s.line,s.oo,s.uo,s.adj),ix=-1;
    S.picks.forEach(function(x,i){if(x.pid===s.id&&x.side===side)ix=i});
    if(ix>=0)S.picks.splice(ix,1);else S.picks.push({pid:s.id,side:side,line:s.line,odds:side==='over'?s.oo:s.uo,prob:side==='over'?c.po:c.pu});
    save();renderNav();propOut();
  }
  else if(act==='rm'){S.picks.splice(+el.dataset.i,1);save();render()}
});
document.addEventListener('input',function(e){
  var b=e.target.dataset&&e.target.dataset.bind;if(!b)return;
  var v=parseFloat(e.target.value);
  if(b==='stake'){S.stake=isFinite(v)&&v>=0?v:0;var c=1;S.picks.forEach(function(x){c*=dec(x.odds)});$('#payout').textContent='$'+(S.stake*c).toFixed(2);return}
  var s=S.sheet;if(!s||s.type!=='prop')return;
  if(b==='pl')s.line=v;else if(b==='po')s.oo=v;else if(b==='pu')s.uo=v;
  else if(b==='pa'){s.adj=isFinite(v)?v:0;$('#pav').textContent=(s.adj>0?'+':'')+s.adj+'%'}
  propOut();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet){S.sheet=null;renderSheet()}});
render();
setTimeout(function(){doRefresh(true)},600);
if(!(window.claude&&window.claude.use)){setInterval(function(){if(document.visibilityState==='visible')doRefresh(true)},30000);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')doRefresh(true)})}
})();
</script>
