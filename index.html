button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--hit)}
:focus-visible{outline:2px solid var(--hit);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
header{position:static;background:var(--bg);padding-block:12px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}

.lede{color:var(--muted);margin:0 0 14px;max-width:60ch}
.label{font-family:var(--font-data);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 12px;min-height:58px}
.prow:first-child{border-top:0}
.prow:active{background:var(--surface2)}
.pr-name{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-sub{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
nav .in{display:flex;width:100%;max-width:640px}
nav button{flex:1;background:none;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:500;min-height:48px;position:relative}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.badge{position:absolute;top:2px;left:calc(50% + 8px);background:var(--hit);color:var(--btn-ink);font-family:var(--font-data);font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.foot{margin:22px 0 0;font-size:12px;color:var(--muted);max-width:60ch}

.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.bcard{padding:12px 14px}
.bcard .facts{margin-top:6px}
.seg2{margin:0 0 12px}

function feedTeams(g){

function leagueTotal(lg){
  var v=[];
  if(lg==='nfl')Object.keys(TS).forEach(function(k){v.push(mv(k,'ppg'))});
  else if(lg==='nhl')return nhlLg().gf*2;
  else if(lg==='nba')Object.keys(NBAT).forEach(function(k){v.push(NBAT[k].PF)});
  else Object.keys(CFB).forEach(function(k){v.push(CFB[k].off)});
  return v.length?2*v.reduce(function(a,b){return a+b},0)/v.length:null;

function feedCalc(g){
  var T=feedTeams(g);if(!T||T.missing)return null;

  if(false)ln={a:g.a,h:g.h,fav:g.dk.sp.fav,pts:g.dk.sp.pts,tt:g.dk.tt,src:g.dk.src||'DraftKings'};
  var wxa=g.lg==='nfl'?wxAdj(T.H.k,g.start):{adj:0,pu:0},mkM=(ln&&ln.pts!=null)?(ln.fav==='h'?ln.pts:-ln.pts):null,total=sa+sh;if(ln&&ln.tt!=null)total=0.1*total+0.9*ln.tt;total+=wxa.adj;

  if(LN.n){margin+=LN.dm;total+=LN.dt;p=Phi(margin/T.sdM)}
  var bets=[],ws=p>=.5?g.h:g.a,wpp=p>=.5?p:1-p;
  bets.push({t:'ml',side:p>=.5?'h':'a',mk:'Moneyline',pick:ws+' to win',p:wpp,conf:wpp>=.7?'high':wpp>=.6?'medium':'low',why:'Blended win chance '+pc(wpp)+'%'+(fp!=null?'; the feed alone says '+pc(p>=.5?fp:1-fp)+'%.':'. No feed win probability, so this is team stats only.')});
  if(ln&&ln.pts!=null){
    var edge=margin-mkM,side=edge>=0?g.h:g.a,mm=Math.abs(mkM);
    var lineTxt=edge>=0?(mkM>=0?'-':'+')+mm.toFixed(1):(mkM>=0?'+':'-')+mm.toFixed(1);
    bets.push({t:'sp',side:edge>=0?'h':'a',num:parseFloat(lineTxt),mk:g.lg==='nhl'?'Puck line':'Spread',pick:side+' '+lineTxt,p:calibCover(Phi(Math.abs(edge)/T.sdM)),conf:confOf(edge/(T.sdM/13.5)),why:'Blended margin '+(margin>=0?g.h:g.a)+' by '+Math.abs(margin).toFixed(1)+' versus the listed '+ln.sp+'.'});

  }
  bets.forEach(function(b){b.p0=b.p;b.p=(g.lg==='nhl'&&b.t==='sp')?Math.max(.3,Math.min(.8,b.p+(LN.dp.sp||0))):learnP(LN,b.t,b.p);b.rm=rawM;b.rt=rawT;b.pmH=pModel;b.mkH=mkH;b.src=ln&&ln.srcs?ln.srcs.join(', '):null});
  return {T:T,p:p,fp:fp,ln:ln,total:total,margin:margin,bets:bets,LN:LN};
}
function matchupText(g,Ra,Rh){

function fetchEspn(lg){

  if(!isFinite(b))b=(m.yes_bid!=null?m.yes_bid/100:NaN);if(!isFinite(a))a=(m.yes_ask!=null?m.yes_ask/100:NaN);
  var p=null,w=null;
  if(isFinite(b)&&isFinite(a)&&a>0){p=(a+b)/2;w=a-b}
  else if(isFinite(l)&&l>0){p=l;w=.3}
  return {p:p,w:w,v:parseFloat(m.volume_fp||m.volume||0)||0};
}
function kCross(pts){ // pts: [[strike,p]] with p falling as strike rises; return strike where p=.5
  pts=pts.filter(function(x){return x[1]!=null}).sort(function(a,b){return a[0]-b[0]});
  if(!pts.length)return null;
  if(pts[0][1]<.5)return null;
  for(var i=1;i<pts.length;i++){
    if(pts[i][1]<.5){var a=pts[i-1],b=pts[i],f=(a[1]-.5)/Math.max(.001,a[1]-b[1]);return a[0]+f*(b[0]-a[0])}

}
function kalBuild(rows){ // rows: [{lg,kind,ev,tk,m}]

function pvHtml(g){

  if(window.claude&&window.claude.use)return '<h3>ESPN game preview</h3><p class="note" style="margin-top:0">The ESPN preview loads in the installed app, not in this preview.</p>';
  pvEnsure(g);
  var c=S.box[g.id],j=c&&c.j,h='<h3>ESPN game preview</h3>';
  var link='https://www.espn.com/'+(ESPN_WEB[g.lg]||g.lg)+'/game/_/gameId/'+encodeURIComponent(g.sid);
  if(!j)return h+'<p class="note" style="margin-top:0">Loading ESPN’s preview data…</p><p class="src"><a href="'+link+'" target="_blank" rel="noopener">Open the full preview on ESPN</a></p>';
  var out=[],tn=function(t){return esc(pvTeam(g,t))};
  // matchup predictor vs DraftKings
  var pr=j.predictor;
  if(pr&&pr.homeTeam&&pr.awayTeam&&pr.homeTeam.gameProjection&&pr.awayTeam.gameProjection){
    var ph=parseFloat(pr.homeTeam.gameProjection),pa=parseFloat(pr.awayTeam.gameProjection),s=ph+pa;
    if(s>0){ph=ph/s;pa=pa/s;
      var line='ESPN’s Matchup Predictor gives '+esc(g.a)+' '+Math.round(pa*100)+'% and '+esc(g.h)+' '+Math.round(ph*100)+'% to win.';
      if(g.dk&&g.dk.ml){var mh=nov(g.dk.ml.a,g.dk.ml.h),df=ph-mh;line+=' DraftKings’ price implies '+esc(g.h)+' '+Math.round(mh*100)+'%, '+(Math.abs(df)<.03?'about the same.':'so ESPN is '+Math.round(Math.abs(df)*100)+' points '+(df>0?'higher':'lower')+' on '+esc(g.h)+'. A gap this size is worth a second look at injuries and lineups.')}
      out.push('<li>'+line+'</li>')}
  }
  // last five
  var l5=j.lastFiveGames;
  if(Array.isArray(l5)&&l5.length){
    l5.forEach(function(t){
      var ev=t.events||[];if(!ev.length)return;
      var w=ev.filter(function(e){return e.gameResult==='W'}).length;
      out.push('<li><b>'+tn(t.team)+' last '+ev.length+':</b> '+w+'-'+(ev.length-w)+'. '+ev.slice(0,5).map(function(e){return esc(e.gameResult||'')+' '+esc(e.atVs||'')+' '+esc((e.opponent&&e.opponent.abbreviation)||'')+' '+esc(e.score||'')}).join(', ')+'</li>');
    });
  }
  // leaders
  var Ld=j.leaders;
  if(Array.isArray(Ld)&&Ld.length){
    Ld.forEach(function(t){
      var cats=(t.leaders||[]).slice(0,4).map(function(cat){var x=(cat.leaders||[])[0];return x&&x.athlete?esc(cat.displayName||cat.name||'')+': '+esc(x.athlete.displayName||x.athlete.shortName||'')+(x.displayValue?' ('+esc(x.displayValue)+')':''):''}).filter(Boolean);
      if(cats.length)out.push('<li><b>'+tn(t.team)+' leaders:</b> '+cats.join('; ')+'</li>');
    });
  }
  // against the spread (when ESPN fills it in)
  var at=j.againstTheSpread;
  if(Array.isArray(at)){
    at.forEach(function(t){var rs=(t.records||[]).filter(function(r){return r&&(r.summary||r.displayValue)}).slice(0,3).map(function(r){return esc(r.type||r.name||'')+' '+esc(r.summary||r.displayValue)});
      if(rs.length)out.push('<li><b>'+tn(t.team)+' against the spread:</b> '+rs.join('; ')+'</li>')});
  }
  // injuries with returns
  var inj=j.injuries;
  if(Array.isArray(inj)&&inj.length){
    inj.forEach(function(t){
      var L=(t.injuries||[]).filter(function(x){return x.athlete}).slice(0,6).map(function(x){var d=x.details||{};return esc(x.athlete.displayName||x.athlete.fullName)+' ('+esc((x.athlete.position&&x.athlete.position.abbreviation)||'')+') '+esc(x.status||'')+(d.type&&d.type!=='Not Specified'?', '+esc(d.type):'')+(d.returnDate?', est. return '+esc(d.returnDate):'')});
      if(L.length)out.push('<li><b>'+tn(t.team)+' injuries:</b> '+L.join('; ')+'</li>');
    });
  }
  // venue and weather if present
  var gi=j.gameInfo||{},ven=gi.venue&&gi.venue.fullName;
  if(ven||gi.weather){var wx=gi.weather?(gi.weather.displayValue||'')+(gi.weather.temperature!=null?', '+gi.weather.temperature+'°':''):'';out.push('<li><b>Venue:</b> '+esc(ven||'')+(gi.venue&&gi.venue.address&&gi.venue.address.city?', '+esc(gi.venue.address.city):'')+(wx?'. <b>Weather:</b> '+esc(wx):'')+'</li>')}
  // headlines that mention either team
  var nw=((j.news&&j.news.articles)||[]).filter(function(a){var t=(a.headline||'')+' '+(a.description||''),w1=String(g.an||'').split(' ').pop(),w2=String(g.hn||'').split(' ').pop();return (w1&&t.indexOf(w1)>=0)||(w2&&t.indexOf(w2)>=0)}).slice(0,3);
  nw.forEach(function(a){var hr=a.links&&a.links.web&&a.links.web.href;out.push('<li><b>ESPN story:</b> '+(hr?'<a href="'+esc(hr)+'" target="_blank" rel="noopener">'+esc(a.headline)+'</a>':esc(a.headline))+(a.description?'. '+esc(a.description):'')+'</li>')});
  if(!out.length)h+='<p class="note" style="margin-top:0">ESPN has not posted preview data for this game yet.</p>';
  else h+='<ul class="pts">'+out.join('')+'</ul>';
  return h+'<p class="src">From ESPN’s game data, loaded '+esc(fmtClock(c.t||Date.now()))+'. ESPN’s written preview article is not part of its public data, so it can’t be copied in here. <a href="'+link+'" target="_blank" rel="noopener">Read the full preview on ESPN</a>.</p>';
}

function research(g){
  var r=researchK0(g);if(!r||!g||!g.dk)return r;
  try{var d=g.dk;
    if(d.sp){r.fav=d.sp.fav;r.pts=d.sp.pts}
    if(d.tt!=null)r.total=d.tt;
    if(d.ml)r.ml={a:d.ml.a,h:d.ml.h};
    r.favT=r.fav==='h'?r.h:r.a;r.dogT=r.fav==='h'?r.a:r.h;
    r.fs=(r.total+r.pts)/2;r.ds=(r.total-r.pts)/2;
    r.bkA=r.ml?nov(r.ml.a,r.ml.h):null;r.gap=r.bkA==null?null:Math.abs(r.bkA-r.mkA);
    r.src='DraftKings, live from ESPN';r.fresh=true;r.alt='';
  }catch(e){}
  return r;
}
function dkLine(g){return g&&g.dk?espnOddsHtml(g):''}
function dkCompact(g){
  var d=g.dk;if(!d)return '';var p=d.px||{},t=[];
  if(d.sp){var fa=d.sp.fav==='a',pt=d.sp.pts;t.push('spread '+esc(g.a)+' '+sgn(pt===0?0:(fa?-pt:pt))+(p.sa!=null?' ('+prc(p.sa)+')':'')+' / '+esc(g.h)+' '+sgn(pt===0?0:(fa?pt:-pt))+(p.sh!=null?' ('+prc(p.sh)+')':''))}
  if(d.tt!=null)t.push('total '+d.tt+(p.to!=null?' (o '+prc(p.to)+' / u '+prc(p.tu)+')':''));
  if(d.ml)t.push('ML '+esc(g.a)+' '+prc(d.ml.a)+' / '+esc(g.h)+' '+prc(d.ml.h));
  return t.length?'<div class="src" style="margin-top:8px"><b>'+esc(d.src||'DraftKings')+' (via ESPN)</b>: '+t.join(' · ')+'</div>':'';
}


function roFix(p){
  if(!S.rosLAt)return;
  var base=p.team0||p.team,lg=p.lg;
  if(onRoster(lg,base,p.name)){if(p.team0){p.team=p.team0;delete p.team0;delete p.moved}p.off=false;return}
  var t=S.rosWho[lg+'|'+normName(p.name)];
  p.team0=base;
  if(t&&t!==base){p.team=t;p.moved=base;p.off=false}else{p.team=base;p.off=true;delete p.moved}
}
function stableKey(n){var c=0;LG.forEach(function(l){c+=(S.feed[l[0]]||[]).length});return (S.userRefreshAt||0)+'|'+S.mine.length+'|'+c+'|'+S.rosLAt+'|'+dayKey(Date.now())+'|'+(S.glV||0)+'|'+(S.rsAt||0)+(n?'':'|e')}
function withFinals(lg,gm){
  if(lg==='ncaamb'||gm.some(function(g){return kind(g)==='final'&&g.sa!=null}))return Promise.resolve(gm);
  var qs=lg==='ncaafb'?'&groups=80&limit=300':'&limit=100',ps=[];
  for(var d=1;d<=4;d++){var dt=new Date(Date.now()-d*864e5).toISOString().slice(0,10).replace(/-/g,'');
    ps.push(fetch('https://site.api.espn.com/apis/site/v2/sports/'+ESPN[lg]+'/scoreboard?dates='+dt+qs,{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}))}
  return Promise.all(ps).then(function(js){
    var seen={};gm.forEach(function(g){seen[g.id]=1});
    js.forEach(function(j){if(j&&j.events)espnNorm(lg,j.events).forEach(function(g){if(!seen[g.id]){seen[g.id]=1;gm.push(g)}})});
    return gm;
  });
}
